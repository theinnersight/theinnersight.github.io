name: daily tarot
run-name: "daily tarot — ${{ github.event_name }} ${{ github.event.schedule }}"

env:
  # several actions still target Node 20; runner Node 24 is the current default
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  schedule:
    - cron: "45 17 * * *"     # tarot:primary
    - cron: "15 18 * * *"     # catch-up +1h
    - cron: "45 21 * * *"     # catch-up +4h
  push:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      date:   { description: "YYYY-MM-DD (local)", required: false }
      force:  { description: "Regenerate even if post exists", type: boolean, default: false }
      check:  { description: "Verify config and exit", type: boolean, default: false }
      deploy: { description: "Deploy even off the default branch", type: boolean, default: false }

permissions:
  contents: write
  issues: write

# group name is versioned: bump the suffix to escape a wedged run.
# cancel-in-progress so a zombie is superseded rather than blocking the day.
concurrency:
  group: daily-tarot-v2
  cancel-in-progress: true

jobs:
  generate:
    if: ${{ github.repository == 'theinnersight/theinnersight.github.io' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mint app token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: theinnersight
          repositories: innersight-agent

      - name: Checkout site
        uses: actions/checkout@v5
        with:
          path: site
          fetch-depth: 0

      - name: Checkout agent
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.AGENT_REPO }}
          token: ${{ steps.app.outputs.token }}
          path: .agent

      - uses: actions/setup-node@v5
        with: { node-version: "22" }

      - name: Preflight
        env:
          AGENT_DIR: ${{ github.workspace }}/.agent
        run: |
          set -euo pipefail

          test -n "${{ secrets.API_KEY }}" || { echo "::error::no API key"; exit 1; }
          test -f "$AGENT_DIR/scripts/run-agent.mjs" \
            || { echo "::error::agent repo not checked out"; exit 1; }

          echo "node $(node --version)"

          n=0
          for f in $(find "$AGENT_DIR/scripts" -name '*.mjs' | sort); do
            if ! out=$(node --check "$f" 2>&1); then
              # node's first line is "path:LINE"; the source frame is omitted so
              # nothing from the agent repo is dumped into the log
              line=$(printf '%s' "$out" | head -1 | sed 's/.*://')
              msg=$(printf '%s' "$out" | grep -m1 'SyntaxError' || echo 'syntax error')
              echo "::error file=${f#"$AGENT_DIR/"},line=$line::$msg"
              exit 1
            fi
            n=$((n + 1))
          done
          [ "$n" -gt 0 ] || { echo "::error::no scripts found"; exit 1; }

          echo "syntax ok ($n files)"

      - name: Generate entry
        id: gen
        # keeps the step under the job's 15 min and under run-agent's 7 min deadline
        timeout-minutes: 8
        working-directory: site
        env:
          API_KEY: ${{ secrets.API_KEY }}
          AGENT_DIR: ${{ github.workspace }}/.agent
          EVENT_NAME: ${{ github.event_name }}
          DATE_OVERRIDE: ${{ inputs.date || vars.DATE_OVERRIDE }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.force) || vars.FORCE }}
          CHECK_ONLY: ${{ inputs.check }}
        run: |
          set -o pipefail
          rc=0
          node "$AGENT_DIR/scripts/run-agent.mjs" 2>&1 | tee /tmp/agent.log || rc=$?
          { echo '```'; tail -40 /tmp/agent.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Commit site
        if: ${{ !inputs.check && steps.gen.outputs.skipped == 'false' }}
        working-directory: site
        run: |
          git config user.name  "innersight-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Create ${{ steps.gen.outputs.date }}-entry.md"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" &&
               git push origin "HEAD:${GITHUB_REF_NAME}"; then ok=1; break; fi
            echo "push rejected (attempt $i)"; sleep 5
          done
          [ "$ok" = 1 ] || { echo "::error::push failed after 3 attempts"; exit 1; }

      - name: Commit agent memory
        if: ${{ !cancelled() && !inputs.check && steps.gen.outputs.skipped == 'false' }}
        run: |
          cd .agent
          git config user.name  "innersight-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "memory: ${{ steps.gen.outputs.date }}"
          git push

      - name: Open issue on failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/issues" \
            -f title="daily tarot failed $(date -u +%F)" \
            -f body="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            >/dev/null 2>&1 \
            || echo "::warning::could not open a failure issue (Issues disabled?)"

  deploy:
    needs: generate
    if: ${{ always() && !inputs.check && (github.ref == 'refs/heads/master' || inputs.deploy) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # github.sha is the TRIGGERING commit — generate has since pushed a new
      # post, so build the branch tip or the post waits a day to publish
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Show what we are building
        run: |
          git log -1 --format='building %h %s'
          ls -t _posts/*.md | head -3

      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with: { source: ./, destination: ./_site }
      - uses: actions/upload-pages-artifact@v3
        with: { path: ./_site }
      - id: deploy
        uses: actions/deploy-pages@v4
