name: daily tarot
run-name: "daily tarot — ${{ github.event_name }} ${{ github.event.schedule || github.ref_name }}"

env:
  # Node 20 actions on a Node 24 runner
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  schedule:
    # These are the literal fire times. The old comments claimed each run lands
    # ~5h20m later, which is more delay than the scheduler produces — verify
    # against the run history before trusting either.
    - cron: "10 4 * * *"      # primary
    - cron: "10 5 * * *"      # catch-up +1h
    - cron: "10 8 * * *"      # catch-up +4h
  push:
    branches: ["master"]
    # only the files a regeneration actually depends on
    paths: ["_posts/**", "_config.yml", ".github/workflows/daily-tarot.yml"]
  workflow_dispatch:
    inputs:
      date:   { description: "YYYY-MM-DD (local)", required: false }
      force:  { description: "Regenerate even if post exists", type: boolean, default: false }
      check:  { description: "Verify config and exit", type: boolean, default: false }
      deploy: { description: "Deploy even off the default branch", type: boolean, default: false }

permissions:
  contents: write

# bump the suffix to escape a wedged run; cancel-in-progress supersedes zombies.
# check runs get their own group, so verifying config never kills a live generate
concurrency:
  group: daily-tarot-v2-${{ inputs.check && 'check' || 'run' }}
  cancel-in-progress: true

jobs:
  generate:
    if: ${{ github.repository == 'theinnersight/theinnersight.github.io' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    # consumed by notify, which runs only after deploy has landed the build
    outputs:
      date: ${{ steps.gen.outputs.date }}
      skipped: ${{ steps.gen.outputs.skipped }}
      created: ${{ steps.commit.outputs.created }}
      card: ${{ steps.commit.outputs.card }}
    steps:
      - name: Mint app token
        id: app
        # v3: repositories accepts "owner/name", matching vars.AGENT_REPO
        # app-id still works and still warns; client-id wants a different value
        # (the App's OAuth Client ID), so switching needs a new secret first
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: theinnersight
          repositories: ${{ vars.AGENT_REPO }}

      - name: Checkout site
        uses: actions/checkout@v7
        with:
          path: site
          fetch-depth: 0

      - name: Checkout agent
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.AGENT_REPO }}
          token: ${{ steps.app.outputs.token }}
          path: .agent

      - uses: actions/setup-node@v7
        with: { node-version: "22" }

      - name: Preflight
        env:
          API_KEY: ${{ secrets.API_KEY }}
          AGENT_DIR: ${{ github.workspace }}/.agent
          PROVIDER: ${{ secrets.PROVIDER_NAME }}
        run: |
          set -euo pipefail

          # logs are public: keep the private checkout's provider-specific
          # filenames out of them; the name is a secret, not in this file
          PROVIDER="${PROVIDER:-}"
          if [[ "$PROVIDER" =~ ^[a-z0-9.-]+$ ]]; then
            # the guard allows '.', which is a regex metachar: escape it
            redact() { sed -E "s/${PROVIDER//./\\.}/api/gI"; }
          else
            redact() { cat; }
            echo "::warning::secrets.PROVIDER_NAME unset; public logs are not redacted"
          fi

          # env, not an expression — the run script is echoed into the log
          test -n "$API_KEY" || { echo "::error::no API key"; exit 1; }
          test -f "$AGENT_DIR/scripts/run-agent.mjs" \
            || { echo "::error::agent repo not checked out"; exit 1; }

          echo "node $(node --version)"
          # which agent build ran, without pinning it: see the run summary
          { echo -n 'agent '; git -C "$AGENT_DIR" log -1 --format='%h %s'; } | redact >> "$GITHUB_STEP_SUMMARY"

          n=0
          # NUL-delimited: a filename with a space would split the word list
          while IFS= read -r -d '' f; do
            n=$((n + 1))
            # no filenames or source frames: those live in the private checkout
            if ! out=$(node --check "$f" 2>&1 | redact); then
              line=$(printf '%s' "$out" | head -1 | sed 's/.*://')
              msg=$(printf '%s' "$out" | grep -m1 'SyntaxError' || echo 'syntax error')
              echo "::error::agent script #$n has a syntax error (line $line): $msg"
              exit 1
            fi
          done < <(find "$AGENT_DIR/scripts" -name '*.mjs' -print0 | sort -z)
          [ "$n" -gt 0 ] || { echo "::error::no scripts found"; exit 1; }

          echo "syntax ok ($n files)"

      - name: Generate entry
        id: gen
        # headroom above run-agent's 7 min deadline, so the agent's own exit
        # code and log tail survive instead of the runner killing the step
        timeout-minutes: 10
        working-directory: site
        env:
          API_KEY: ${{ secrets.API_KEY }}
          AGENT_DIR: ${{ github.workspace }}/.agent
          PROVIDER: ${{ secrets.PROVIDER_NAME }}
          EVENT_NAME: ${{ github.event_name }}
          DATE_OVERRIDE: ${{ inputs.date || vars.DATE_OVERRIDE }}
          # empty when false, never the string "false": empty is falsy under both
          # `=== 'true'` and bare truthiness. "false" is truthy in JS and put
          # run-agent into check mode on every push and schedule.
          FORCE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.force) || vars.FORCE == 'true') && 'true' || '' }}
          CHECK_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.check && 'true' || '' }}
        run: |
          set -o pipefail
          # public boundary: redact again even though the agent scrubs itself
          PROVIDER="${PROVIDER:-}"
          if [[ "$PROVIDER" =~ ^[a-z0-9.-]+$ ]]; then
            redact() { sed -E "s/${PROVIDER//./\\.}/api/gI"; }
          else
            redact() { cat; }
            echo "::warning::secrets.PROVIDER_NAME unset; public logs are not redacted"
          fi
          rc=0
          node "$AGENT_DIR/scripts/run-agent.mjs" 2>&1 | redact | tee /tmp/agent.log || rc=$?
          { echo '```'; tail -40 /tmp/agent.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Commit site
        id: commit
        # !cancelled(), not implicit success(): a run that hit the deadline can
        # still leave a complete post, and today's was thrown away
        # skipped != 'true', not == 'false': a step that dies before writing the
        # output must still get its complete post committed
        if: ${{ !inputs.check && !cancelled() && steps.gen.outputs.skipped != 'true' }}
        working-directory: site
        env:
          DATE: ${{ steps.gen.outputs.date }}
        run: |
          git config user.name  "innersight-bot"
          git config user.email "bot@users.noreply.github.com"
          [ -n "$DATE" ] || { echo "::warning::no date output; nothing to commit"; exit 0; }
          [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] \
            || { echo "::warning::unexpected date '$DATE'; nothing to commit"; exit 0; }
          post="_posts/${DATE}-entry.md"
          [ -f "$post" ] || { echo "::warning::$post not written; nothing to commit"; exit 0; }
          # a killed run can leave a half-written post; never commit one. The
          # opening fence must be line 1, a closing fence must follow, and the
          # file must end on a newline — a stray '---' rule in the body is not
          # enough on its own to prove the post is complete.
          [ "$(head -1 "$post")" = "---" ] \
            || { echo "::warning::$post has no opening front-matter fence; not committing"; exit 0; }
          awk 'NR>1 && $0=="---"{f=1; exit} END{exit !f}' "$post" \
            || { echo "::warning::$post has no closing front-matter fence; not committing"; exit 0; }
          [ -z "$(tail -c1 "$post")" ] \
            || { echo "::warning::$post does not end on a newline; not committing"; exit 0; }
          card=$(sed -n 's/^card:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}[[:space:]]*$/\1/p' "$post" | head -1 || true)
          git add -A
          # surface anything unexpected the agent dropped into the tree
          git status --short
          git diff --cached --quiet && exit 0
          git commit -m "Create ${DATE}-entry.md"
          # push first and rebase only on rejection: a clean push needs no
          # rebase, and a conflicted rebase must be aborted or every remaining
          # attempt fails with "rebase already in progress"
          attempt=0
          until git push origin "HEAD:${GITHUB_REF_NAME}"; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 3 ]; then
              echo "::error::push failed after 3 attempts; $post is committed locally only"
              exit 1
            fi
            echo "push rejected (attempt $attempt); rebasing onto origin/${GITHUB_REF_NAME}"
            sleep $((attempt * 5 + RANDOM % 5))
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" \
              || { git rebase --abort; echo "::error::rebase conflict on $post"; exit 1; }
          done
          # only a run that actually published the post may announce it
          echo "created=true" >> "$GITHUB_OUTPUT"
          { echo 'card<<CARD'; printf '%s\n' "${card:-new entry}"; echo 'CARD'; } >> "$GITHUB_OUTPUT"

      - name: Commit agent memory
        # the post is published by now: a memory push must not redden the day
        if: ${{ !cancelled() && !inputs.check && steps.gen.outputs.skipped != 'true' }}
        continue-on-error: true
        env:
          DATE: ${{ steps.gen.outputs.date }}
        run: |
          cd .agent
          git config user.name  "innersight-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "memory: ${DATE}"
          branch=$(git rev-parse --abbrev-ref HEAD)
          for i in 1 2 3; do
            git push && exit 0
            sleep $((i * 5 + RANDOM % 5))
            if git fetch origin "$branch" && git rebase "origin/$branch"; then
              :
            else
              git rebase --abort || true
            fi
          done
          echo "::error::memory push failed after 3 attempts"
          exit 1

  deploy:
    needs: generate
    # always(): a failed generate can still have committed a complete post, and
    # the site should go out. The repository guard has to be repeated here — a
    # fork skips generate, and without it deploy would run and fail.
    if: ${{ always() && !inputs.check && github.repository == 'theinnersight/theinnersight.github.io' && (github.ref == 'refs/heads/master' || inputs.deploy) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # branch tip, not github.sha: generate has already pushed today's post
          ref: ${{ github.ref_name }}
          # read-only job: don't leave a write token in .git/config
          persist-credentials: false

      - name: Show what we are building
        run: |
          git log -1 --format='building %h %s'
          ls -t _posts/*.md | head -3

      - uses: actions/configure-pages@v6
      - uses: actions/jekyll-build-pages@v1
        with: { source: ./, destination: ./_site }
      - uses: actions/upload-pages-artifact@v5
        with: { path: ./_site }
      - id: deploy
        uses: actions/deploy-pages@v5

  notify:
    # both results are needed to pick the message, so always() then gate per step
    needs: [generate, deploy]
    # same repository guard as deploy: a fork has no secrets and no Pages
    if: ${{ always() && !inputs.check && github.repository == 'theinnersight/theinnersight.github.io' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    steps:
      # public channel: link and card name only, nothing from the private checkout
      # no checkout here: card and date arrive as outputs, so the URL is already live
      # continue-on-error: the site is up, a discord hiccup must not redden the run
      - name: Notify Discord
        if: ${{ needs.deploy.result == 'success' && needs.generate.outputs.created == 'true' }}
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DATE: ${{ needs.generate.outputs.date }}
          CARD: ${{ needs.generate.outputs.card }}
          BASE: ${{ vars.SITE_URL || 'https://theinnersight.github.io' }}
        run: |
          set -euo pipefail
          [ -n "$WEBHOOK" ] || { echo "::warning::no DISCORD_WEBHOOK_URL secret; skipping"; exit 0; }
          [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] \
            || { echo "::warning::unexpected date '$DATE'; skipping"; exit 0; }
          url="${BASE%/}/tarot/${DATE:0:4}/${DATE:5:2}/${DATE:8:2}/entry.html"

          # deploy-pages returns before the CDN has the build. Poll the real URL
          # rather than announcing a link that 404s, which also covers a human
          # push having moved the tip out from under us.
          live=0
          for i in 1 2 3 4 5; do
            if curl -fsS --head --connect-timeout 5 --max-time 10 -o /dev/null "$url"; then
              live=1; break
            fi
            sleep $((i * 2))
          done
          [ "$live" = 1 ] || echo "::warning::$url not live after 5 checks; announcing anyway"

          payload=$(jq -n --arg url "$url" --arg card "${CARD:-new entry}" --arg date "$DATE" \
            '{allowed_mentions:{parse:[]},
              embeds:[{title:$card, url:$url, color:8089504,
                       description:("Today’s draw is up — " + $date)}]}')
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          code=$(printf '%s' "$payload" | curl -sS --fail-with-body \
                   --retry 3 --retry-delay 2 --retry-all-errors \
                   --connect-timeout 5 --max-time 20 --retry-max-time 45 \
                   -o "$body" -w '%{http_code}' \
                   -H 'Content-Type: application/json' -d @- "$WEBHOOK" || true)
          case "$code" in
            200|204) echo "posted to discord" ;;
            *) echo "::warning::discord returned HTTP ${code:-none}: $(head -c 300 "$body")" ;;
          esac

      # no issue tracker here: this ping and the run page are the only record,
      # so a dead webhook fails the step instead of warning and going quiet
      - name: Notify Discord (failure)
        # cancelled as well as failure: with cancel-in-progress a human Cancel, or
        # a superseding run, otherwise leaves no trace at all
        if: ${{ needs.generate.result == 'failure' || needs.generate.result == 'cancelled' || needs.deploy.result == 'failure' || needs.deploy.result == 'cancelled' }}
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STAGE: ${{ needs.generate.result != 'success' && needs.generate.result != 'skipped' && 'generate' || 'deploy' }}
        run: |
          set -euo pipefail
          [ -n "$WEBHOOK" ] || { echo "::error::no DISCORD_WEBHOOK_URL secret; failures are unannounced"; exit 1; }
          payload=$(jq -n --arg url "$RUN_URL" --arg stage "$STAGE" \
            '{allowed_mentions:{parse:[]},
              embeds:[{title:("daily tarot " + $stage + " failed"), url:$url, color:11549230, description:$url}]}')
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          code=$(printf '%s' "$payload" | curl -sS --fail-with-body \
                   --retry 3 --retry-delay 2 --retry-all-errors \
                   --connect-timeout 5 --max-time 20 --retry-max-time 45 \
                   -o "$body" -w '%{http_code}' \
                   -H 'Content-Type: application/json' -d @- "$WEBHOOK" || true)
          case "$code" in
            200|204) echo "failure notice posted to discord" ;;
            *) echo "::error::discord returned HTTP ${code:-none}: $(head -c 300 "$body")"; exit 1 ;;
          esac
