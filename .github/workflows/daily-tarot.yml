name: daily tarot
run-name: "daily tarot — ${{ github.event_name }} ${{ github.event.schedule }}"

env:
  # Node 20 actions on a Node 24 runner
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  schedule:
    - cron: "10 4 * * *"      # tarot:primary    (target run ~9:30 UTC  / 05:30 EDT)
    - cron: "10 5 * * *"      # catch-up +1h     (target run ~10:30 UTC / 06:30 EDT)
    - cron: "10 8 * * *"      # catch-up +4h     (target run ~13:30 UTC / 09:30 EDT)
  push:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      date:   { description: "YYYY-MM-DD (local)", required: false }
      force:  { description: "Regenerate even if post exists", type: boolean, default: false }
      check:  { description: "Verify config and exit", type: boolean, default: false }
      deploy: { description: "Deploy even off the default branch", type: boolean, default: false }

permissions:
  contents: write

# bump the suffix to escape a wedged run; cancel-in-progress supersedes zombies
concurrency:
  group: daily-tarot-v2
  cancel-in-progress: true

jobs:
  generate:
    if: ${{ github.repository == 'theinnersight/theinnersight.github.io' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    # consumed by the deploy job's notifier, which runs after the build lands
    outputs:
      date: ${{ steps.gen.outputs.date }}
      skipped: ${{ steps.gen.outputs.skipped }}
    steps:
      - name: Mint app token
        id: app
        # v3: repositories accepts "owner/name", matching vars.AGENT_REPO
        # app-id still works and still warns; client-id wants a different value
        # (the App's OAuth Client ID), so switching needs a new secret first
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: theinnersight
          repositories: ${{ vars.AGENT_REPO }}

      - name: Checkout site
        uses: actions/checkout@v5
        with:
          path: site
          fetch-depth: 0

      - name: Checkout agent
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.AGENT_REPO }}
          token: ${{ steps.app.outputs.token }}
          path: .agent

      - uses: actions/setup-node@v5
        with: { node-version: "22" }

      - name: Preflight
        env:
          API_KEY: ${{ secrets.API_KEY }}
          AGENT_DIR: ${{ github.workspace }}/.agent
          PROVIDER: ${{ secrets.PROVIDER_NAME }}
        run: |
          set -euo pipefail

          # logs are public: keep the private checkout's provider-specific
          # filenames out of them; the name is a secret, not in this file
          PROVIDER="${PROVIDER:-}"
          if [[ "$PROVIDER" =~ ^[a-z0-9.-]+$ ]]; then
            redact() { sed -E "s/$PROVIDER/api/gI"; }
          else
            redact() { cat; }
            echo "::warning::secrets.PROVIDER_NAME unset; public logs are not redacted"
          fi

          # env, not an expression — the run script is echoed into the log
          test -n "$API_KEY" || { echo "::error::no API key"; exit 1; }
          test -f "$AGENT_DIR/scripts/run-agent.mjs" \
            || { echo "::error::agent repo not checked out"; exit 1; }

          echo "node $(node --version)"

          n=0
          for f in $(find "$AGENT_DIR/scripts" -name '*.mjs' | sort); do
            n=$((n + 1))
            # no filenames or source frames: those live in the private checkout
            if ! out=$(node --check "$f" 2>&1 | redact); then
              line=$(printf '%s' "$out" | head -1 | sed 's/.*://')
              msg=$(printf '%s' "$out" | grep -m1 'SyntaxError' || echo 'syntax error')
              echo "::error::agent script #$n has a syntax error (line $line): $msg"
              exit 1
            fi
          done
          [ "$n" -gt 0 ] || { echo "::error::no scripts found"; exit 1; }

          echo "syntax ok ($n files)"

      - name: Generate entry
        id: gen
        # headroom above run-agent's 7 min deadline, so the agent's own exit
        # code and log tail survive instead of the runner killing the step
        timeout-minutes: 10
        working-directory: site
        env:
          API_KEY: ${{ secrets.API_KEY }}
          AGENT_DIR: ${{ github.workspace }}/.agent
          PROVIDER: ${{ secrets.PROVIDER_NAME }}
          EVENT_NAME: ${{ github.event_name }}
          DATE_OVERRIDE: ${{ inputs.date || vars.DATE_OVERRIDE }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.force) || vars.FORCE }}
          CHECK_ONLY: ${{ inputs.check }}
        run: |
          set -o pipefail
          # public boundary: redact again even though the agent scrubs itself
          PROVIDER="${PROVIDER:-}"
          if [[ "$PROVIDER" =~ ^[a-z0-9.-]+$ ]]; then
            redact() { sed -E "s/$PROVIDER/api/gI"; }
          else
            redact() { cat; }
            echo "::warning::secrets.PROVIDER_NAME unset; public logs are not redacted"
          fi
          rc=0
          node "$AGENT_DIR/scripts/run-agent.mjs" 2>&1 | redact | tee /tmp/agent.log || rc=$?
          { echo '```'; tail -40 /tmp/agent.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Commit site
        # !cancelled(), not implicit success(): a run that hit the deadline can
        # still leave a complete post, and today's was thrown away
        if: ${{ !inputs.check && !cancelled() && steps.gen.outputs.skipped == 'false' }}
        working-directory: site
        env:
          DATE: ${{ steps.gen.outputs.date }}
        run: |
          git config user.name  "innersight-bot"
          git config user.email "bot@users.noreply.github.com"
          [ -n "$DATE" ] || { echo "::warning::no date output; nothing to commit"; exit 0; }
          post="_posts/${DATE}-entry.md"
          [ -f "$post" ] || { echo "::warning::$post not written; nothing to commit"; exit 0; }
          # a killed run can leave a half-written post; never commit one
          [ "$(head -1 "$post")" = "---" ] && [ "$(grep -c '^---$' "$post")" -ge 2 ] \
            || { echo "::warning::$post has no closing front-matter fence; not committing"; exit 0; }
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Create ${DATE}-entry.md"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" &&
               git push origin "HEAD:${GITHUB_REF_NAME}"; then ok=1; break; fi
            echo "push rejected (attempt $i)"; sleep 5
          done
          [ "$ok" = 1 ] || { echo "::error::push failed after 3 attempts"; exit 1; }

      - name: Commit agent memory
        if: ${{ !cancelled() && !inputs.check && steps.gen.outputs.skipped == 'false' }}
        run: |
          cd .agent
          git config user.name  "innersight-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "memory: ${{ steps.gen.outputs.date }}"
          git push

      # no issue tracker here: this ping and the run page are the only record,
      # so a dead webhook fails the step instead of warning and going quiet
      - name: Notify Discord (failure)
        if: ${{ failure() }}
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [ -n "$WEBHOOK" ] || { echo "::error::no DISCORD_WEBHOOK_URL secret; failures are unannounced"; exit 1; }
          payload=$(jq -n --arg url "$RUN_URL" \
            '{allowed_mentions:{parse:[]},
              embeds:[{title:"daily tarot failed", url:$url, color:11549230, description:$url}]}')
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          code=$(printf '%s' "$payload" | curl -sS --fail-with-body \
                   --retry 3 --retry-delay 2 --retry-all-errors \
                   -o "$body" -w '%{http_code}' \
                   -H 'Content-Type: application/json' -d @- "$WEBHOOK" || true)
          case "$code" in
            200|204) echo "failure notice posted to discord" ;;
            *) echo "::error::discord returned HTTP ${code:-none}: $(head -c 300 "$body")"; exit 1 ;;
          esac

  deploy:
    needs: generate
    if: ${{ always() && !inputs.check && (github.ref == 'refs/heads/master' || inputs.deploy) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          # branch tip, not github.sha: generate has already pushed today's post
          ref: ${{ github.ref_name }}

      - name: Show what we are building
        run: |
          git log -1 --format='building %h %s'
          ls -t _posts/*.md | head -3

      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with: { source: ./, destination: ./_site }
      - uses: actions/upload-pages-artifact@v3
        with: { path: ./_site }
      - id: deploy
        uses: actions/deploy-pages@v4

      # public channel: link and card name only, nothing from the private checkout
      # runs only after deploy, so the announced URL is already live
      # continue-on-error: the site is up, a discord hiccup must not redden the run
      - name: Notify Discord
        if: ${{ success() && !inputs.check && needs.generate.outputs.skipped == 'false' && github.event_name != 'push' }}
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DATE: ${{ needs.generate.outputs.date }}
          BASE: ${{ vars.SITE_URL || 'https://theinnersight.github.io' }}
        run: |
          set -euo pipefail
          [ -n "$WEBHOOK" ] || { echo "::warning::no DISCORD_WEBHOOK_URL secret; skipping"; exit 0; }
          [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] \
            || { echo "::warning::unexpected date '$DATE'; skipping"; exit 0; }
          [ "$(git log -1 --format=%s)" = "Create ${DATE}-entry.md" ] \
            || { echo "::warning::tip is not today's post commit; skipping"; exit 0; }

          post="_posts/${DATE}-entry.md"
          card=""
          if [ -f "$post" ]; then
            card=$(sed -n 's/^card:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}[[:space:]]*$/\1/p' "$post" | head -1 || true)
          fi
          url="${BASE%/}/tarot/${DATE:0:4}/${DATE:5:2}/${DATE:8:2}/entry.html"

          payload=$(jq -n --arg url "$url" --arg card "${card:-new entry}" --arg date "$DATE" \
            '{allowed_mentions:{parse:[]},
              embeds:[{title:$card, url:$url, color:8089504,
                       description:("Today’s draw is up — " + $date)}]}')
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          code=$(printf '%s' "$payload" | curl -sS --fail-with-body \
                   --retry 3 --retry-delay 2 --retry-all-errors \
                   -o "$body" -w '%{http_code}' \
                   -H 'Content-Type: application/json' -d @- "$WEBHOOK" || true)
          case "$code" in
            200|204) echo "posted to discord" ;;
            *) echo "::warning::discord returned HTTP ${code:-none}: $(head -c 300 "$body")" ;;
          esac

      # deploy failures were otherwise silent: generate's notifier only covers generate
      - name: Notify Discord (deploy failed)
        if: ${{ failure() && needs.generate.result == 'success' }}
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [ -n "$WEBHOOK" ] || { echo "::error::no DISCORD_WEBHOOK_URL secret; failures are unannounced"; exit 1; }
          payload=$(jq -n --arg url "$RUN_URL" \
            '{allowed_mentions:{parse:[]},
              embeds:[{title:"daily tarot deploy failed", url:$url, color:11549230, description:$url}]}')
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          code=$(printf '%s' "$payload" | curl -sS --fail-with-body \
                   --retry 3 --retry-delay 2 --retry-all-errors \
                   -o "$body" -w '%{http_code}' \
                   -H 'Content-Type: application/json' -d @- "$WEBHOOK" || true)
          case "$code" in
            200|204) echo "deploy-failure notice posted to discord" ;;
            *) echo "::error::discord returned HTTP ${code:-none}: $(head -c 300 "$body")"; exit 1 ;;
          esac
