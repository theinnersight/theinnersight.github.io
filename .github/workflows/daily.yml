name: daily tarot

on:
  schedule:
    - cron: "0 10 * * *"      # 10:00 UTC = 05:00 EST / 06:00 EDT
  push:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      date:   { description: "YYYY-MM-DD (local)", required: false }
      force:  { description: "Regenerate even if post exists", type: boolean, default: false }
      check:  { description: "Verify config and exit", type: boolean, default: false }
      deploy: { description: "Deploy even off the default branch", type: boolean, default: false }

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-tarot
  cancel-in-progress: false

jobs:
  generate:
    if: ${{ github.repository == 'theinnersight/theinnersight.github.io' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mint app token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: theinnersight
          repositories: innersight-agent

      - name: Checkout site
        uses: actions/checkout@v5
        with:
          path: site
          fetch-depth: 0

      - name: Checkout agent
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.AGENT_REPO }}
          token: ${{ steps.app.outputs.token }}
          path: .agent

      - uses: actions/setup-node@v5
        with: { node-version: "22" }

      - name: Preflight
        run: |
          test -n "${{ secrets.API_KEY }}" || { echo "::error::API_KEY missing"; exit 1; }
          test -f "${{ github.workspace }}/.agent/scripts/run-agent.mjs" \
            || { echo "::error::AGENT_REPO unset or wrong — no run-agent.mjs"; exit 1; }

      - name: Generate entry
        id: gen
        working-directory: site
        env:
          API_KEY: ${{ secrets.API_KEY }}
          AGENT_DIR: ${{ github.workspace }}/.agent
          EVENT_NAME: ${{ github.event_name }}
          DATE_OVERRIDE: ${{ inputs.date || vars.DATE_OVERRIDE }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.force) || vars.FORCE }}
          CHECK_ONLY: ${{ inputs.check }}
        run: node "$AGENT_DIR/scripts/run-agent.mjs"

      - name: Commit site
        if: ${{ !inputs.check && steps.gen.outputs.skipped == 'false' }}
        working-directory: site
        run: |
          git config user.name  "innersight-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Create ${{ steps.gen.outputs.date }}-entry.md"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" &&
               git push origin "HEAD:${GITHUB_REF_NAME}"; then ok=1; break; fi
            echo "push rejected (attempt $i)"; sleep 5
          done
          [ "$ok" = 1 ] || { echo "::error::push failed after 3 attempts"; exit 1; }

      - name: Commit agent memory
        if: ${{ !cancelled() && !inputs.check && steps.gen.outputs.skipped == 'false' }}
        run: |
          cd .agent
          git config user.name  "innersight-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "memory: ${{ steps.gen.outputs.date }}"
          git push

      - name: Open issue on failure
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh api "repos/${{ github.repository }}/issues" \
            -f title="daily tarot failed $(date -u +%F)" \
            -f body="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          || { echo "::error::issue create failed"; gh auth status; exit 1; }

  deploy:
    needs: generate
    if: ${{ always() && (github.ref == 'refs/heads/master' || inputs.deploy) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with: { source: ./, destination: ./_site }
      - uses: actions/upload-pages-artifact@v3
        with: { path: ./_site }
      - id: deploy
        uses: actions/deploy-pages@v4
